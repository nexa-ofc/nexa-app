name: NexaBuild

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baca konfigurasi build
        id: cfg
        run: |
          python3 - <<'PY'
          import json,base64,os
          cfg=json.load(open("nexabuild.config.json"))
          b64=cfg.get("zipBase64")
          if b64:
              os.makedirs("project",exist_ok=True)
              open("project/project.zip","wb").write(base64.b64decode(b64))
          os.makedirs("keystore",exist_ok=True)
          ks=cfg.get("keystore") or {}
          if ks.get("mode")=="upload" and ks.get("data"):
              open("keystore/app.jks","wb").write(base64.b64decode(ks["data"]))
          g=cfg.get("push",{}).get("gjson")
          if g:
              os.makedirs("project/android/app",exist_ok=True)
              open("project/android/app/google-services.json","w").write(json.dumps(g))
          gh_out=os.environ["GITHUB_OUTPUT"]
          with open(gh_out,"a") as f:
              for k in ["appName","shortName","packageId","versionName","projectType","sourceType","url","orientation","themeColor","splashText","privacyUrl"]:
                  f.write(f"{k}={cfg.get(k,'')}\n")
              f.write(f"versionCode={cfg.get('versionCode',1)}\n")
              f.write(f"webview={json.dumps(cfg.get('webview',{}))}\n")
              f.write(f"whitelist={json.dumps(cfg.get('whitelist',[]))}\n")
              f.write(f"permissions={json.dumps(cfg.get('permissions',[]))}\n")
              f.write(f"keystoreMode={ks.get('mode','auto')}\n")
          if cfg.get("iconDataUrl"):
              open("icon.png","wb").write(base64.b64decode(cfg["iconDataUrl"].split(",",1)[1]))
          else:
              # icon default: inisial di atas warna tema
              from PIL import Image,ImageDraw,ImageFont
              img=Image.new("RGB",(512,512),cfg.get("themeColor","#ffd6e0"))
              d=ImageDraw.Draw(img)
              try: font=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",220)
              except: font=ImageFont.load_default()
              ch=(cfg.get("appName") or "N")[0].upper()
              bb=d.textbbox((0,0),ch,font=font)
              d.text(((512-(bb[2]-bb[0]))/2-bb[0],(512-(bb[3]-bb[1]))/2-bb[1]),ch,fill="#1e1e1e",font=font)
              img.save("icon.png")
          PY

      - name: Ekstrak project
        if: steps.cfg.outputs.sourceType == 'zip'
        run: |
          cd project && unzip -q project.zip && rm project.zip
          shopt -s dotglob; mv * ../ 2>/dev/null || true; cd ..

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - name: Setup Node
        if: steps.cfg.outputs.projectType != 'flutter'
        uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm install -g @capacitor/cli cordova 2>/dev/null || true
        if: steps.cfg.outputs.projectType != 'flutter'

      - name: Setup Flutter
        if: steps.cfg.outputs.projectType == 'flutter'
        uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - name: Generate Android project (Capacitor/WebView)
        if: steps.cfg.outputs.projectType == 'capacitor' || steps.cfg.outputs.projectType == 'webview'
        run: |
          mkdir -p android-app
          cd android-app
          if [ "${{ steps.cfg.outputs.projectType }}" = "webview" ]; then
            mkdir -p www && echo '<script>location.href="${{ steps.cfg.outputs.url }}"</script>' > www/index.html
            npm init -y >/dev/null
            npm install @capacitor/core @capacitor/cli @capacitor/android >/dev/null 2>&1
            npx cap init "${{ steps.cfg.outputs.appName }}" "${{ steps.cfg.outputs.packageId }}" --web-dir www >/dev/null
          else
            cd .. && cp -r project/* android-app/ 2>/dev/null || true; cd android-app
            [ -f package.json ] || npm init -y >/dev/null
            npm install >/dev/null 2>&1 || true
            npm install @capacitor/core @capacitor/cli @capacitor/android >/dev/null 2>&1
            npx cap add android >/dev/null 2>&1 || true
          fi
          npx cap sync android >/dev/null 2>&1 || true

      - name: Generate Android project (Cordova)
        if: steps.cfg.outputs.projectType == 'cordova'
        run: |
          mkdir -p cordova-app && cd cordova-app
          cp -r ../project/* . 2>/dev/null || true
          cordova platform add android >/dev/null 2>&1 || true

      - name: Generate Android project (React Native)
        if: steps.cfg.outputs.projectType == 'reactnative'
        run: |
          cp -r project rn-app 2>/dev/null || true; cd rn-app
          npm install >/dev/null 2>&1 || true
          cd android || exit 0

      - name: Generate keystore (jika mode auto)
        if: steps.cfg.outputs.keystoreMode == 'auto'
        run: |
          keytool -genkeypair -v -keystore keystore/app.jks -alias nexabuild \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass nexabuild123 -keypass nexabuild123 \
            -dname "CN=NexaBuild, OU=NexaBuild, O=NexaBuild, L=Jakarta, S=Jakarta, C=ID"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Konfigurasi gradle.properties (R8 full, cache)
        run: |
          ROOT=""
          for d in android-app/android cordova-app/platforms/android rn-app/android flutter-app/android project/android; do
            [ -d "$d" ] && ROOT="$d" && break
          done
          echo "ANDROID_ROOT=$ROOT" >> $GITHUB_ENV
          [ -z "$ROOT" ] && exit 0
          cat >> $ROOT/gradle.properties <<'EOF'
          org.gradle.caching=true
          org.gradle.parallel=true
          android.useAndroidX=true
          android.enableR8.fullMode=true
          EOF

      - name: Network security config (blokir cleartext + whitelist)
        run: |
          ROOT="${{ env.ANDROID_ROOT }}"; [ -z "$ROOT" ] && exit 0
          python3 - "$ROOT" <<'PY'
          import json,os,sys
          root=sys.argv[1]
          wl=json.loads(os.environ.get("WHITELIST","[]"))
          dom="\n".join(f'        <domain includeSubdomains="true">{d}</domain>' for d in wl)
          nsc=f'''<?xml version="1.0" encoding="utf-8"?>
      <network-security-config>
          <domain-config cleartextTrafficPermitted="{"true" if wl else "false"}">
      {dom or '        <domain includeSubdomains="true">localhost</domain>'}
          </domain-config>
      </network-security-config>'''
          os.makedirs(f"{root}/app/src/main/res/xml",exist_ok=True)
          open(f"{root}/app/src/main/res/xml/network_security_config.xml","w").write(nsc)
          mf=f"{root}/app/src/main/AndroidManifest.xml"
          if os.path.exists(mf):
              s=open(mf).read()
              if "networkSecurityConfig" not in s:
                  s=s.replace("<application",'<application android:networkSecurityConfig="@xml/network_security_config"',1)
                  open(mf,"w").write(s)
          PY
        env:
          WHITELIST: ${{ steps.cfg.outputs.whitelist }}

      - name: Set version, package, label, permissions, orientasi
        run: |
          ROOT="${{ env.ANDROID_ROOT }}"; [ -z "$ROOT" ] && exit 0
          python3 - "$ROOT" <<'PY'
          import json,os,re,sys
          root=sys.argv[1]
          perms=json.loads(os.environ["PERMS"])
          bf=f"{root}/app/build.gradle"
          if not os.path.exists(bf): bf=f"{root}/app/build.gradle.kts"
          s=open(bf).read()
          s=re.sub(r"applicationId\s*[= ]+\"[^\"]+\"",f'applicationId "{os.environ["PKG"]}"',s)
          s=re.sub(r"versionCode\s*[= ]+\d+",f'versionCode {os.environ["VCODE"]}',s)
          s=re.sub(r"versionName\s*[= ]+\"[^\"]+\"",f'versionName "{os.environ["VNAME"]}"',s)
          if "signingConfigs" not in s:
              s=s.replace("android {",'''android {
              signingConfigs {
                  release {
                      storeFile file("../../keystore/app.jks")
                      storePassword "nexabuild123"
                      keyAlias "nexabuild"
                      keyPassword "nexabuild123"
                      enableV1Signing true
                      enableV2Signing true
                      enableV3Signing true
                  }
              }''',1)
              s=re.sub(r"buildTypes\s*{",'''buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
                  }''',s)
          open(bf,"w").write(s)
          mf=f"{root}/app/src/main/AndroidManifest.xml"
          if os.path.exists(mf):
              m=open(mf).read()
              for p in perms:
                  tag=f'<uses-permission android:name="android.permission.{p}"/>'
                  if p not in m: m=m.replace("</manifest>",tag+"</manifest>")
              if os.environ["ORIENT"]!="sensor":
                  m=re.sub(r'android:screenOrientation="[^"]*"','',m)
                  m=m.replace("<activity",f'<activity android:screenOrientation="{os.environ["ORIENT"]}"',1)
              open(mf,"w").write(m)
          # keep rules minimal sesuai tipe
          rules=f"{root}/app/proguard-rules.pro"
          open(rules,"a").write("\n-keep class ${{ steps.cfg.outputs.packageId }}.** {{ *; }}\n-dontwarn okhttp3.**\n-dontwarn okio.**\n")
          PY
        env:
          PKG: ${{ steps.cfg.outputs.packageId }}
          VCODE: ${{ steps.cfg.outputs.versionCode }}
          VNAME: ${{ steps.cfg.outputs.versionName }}
          PERMS: ${{ steps.cfg.outputs.permissions }}
          ORIENT: ${{ steps.cfg.outputs.orientation }}

      - name: Generate icon semua density
        run: |
          ROOT="${{ env.ANDROID_ROOT }}"; [ -z "$ROOT" ] && exit 0
          python3 - "$ROOT" <<'PY'
          from PIL import Image
          import os,sys
          root=sys.argv[1]
          sizes={"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          src=Image.open("icon.png").convert("RGBA")
          for d,s in sizes.items():
              p=f"{root}/app/src/main/res/mipmap-{d}"
              os.makedirs(p,exist_ok=True)
              src.resize((s,s),Image.LANCZOS).save(f"{p}/ic_launcher.png")
              src.resize((s,s),Image.LANCZOS).save(f"{p}/ic_launcher_round.png")
          # adaptive foreground
          fg=Image.new("RGBA",(432,432),(0,0,0,0))
          fg.paste(src.resize((288,288),Image.LANCZOS),(72,72))
          for d,s in {"mdpi":108,"hdpi":162,"xhdpi":216,"xxhdpi":324,"xxxhdpi":432}.items():
              p=f"{root}/app/src/main/res/mipmap-{d}"
              os.makedirs(p,exist_ok=True)
              fg.resize((s,s),Image.LANCZOS).save(f"{p}/ic_launcher_foreground.png")
          PY

      - name: Build APK (universal) + AAB
        run: |
          ROOT="${{ env.ANDROID_ROOT }}"
          if [ "${{ steps.cfg.outputs.projectType }}" = "flutter" ]; then
            cd project 2>/dev/null || cd flutter-app 2>/dev/null || true
            flutter pub get
            flutter build apk --release --split-per-abi
            flutter build appbundle --release
            echo "APK_DIR=build/app/outputs/flutter-apk" >> $GITHUB_ENV
            echo "AAB_DIR=build/app/outputs/bundle/release" >> $GITHUB_ENV
          else
            [ -z "$ROOT" ] && exit 1
            chmod +x $ROOT/gradlew 2>/dev/null || true
            cd $ROOT && ./gradlew --build-cache :app:assembleRelease :app:bundleRelease
            echo "APK_DIR=$ROOT/app/build/outputs/apk/release" >> $GITHUB_ENV
            echo "AAB_DIR=$ROOT/app/build/outputs/bundle/release" >> $GITHUB_ENV
          fi

      - name: Rename artifact dengan versi
        run: |
          V="${{ steps.cfg.outputs.versionName }}-${{ steps.cfg.outputs.versionCode }}"
          mkdir -p out
          cp ${{ env.APK_DIR }}/*.apk out/ 2>/dev/null || true
          cp ${{ env.AAB_DIR }}/*.aab out/ 2>/dev/null || true
          cd out
          for f in *.apk; do [ -f "$f" ] && mv "$f" "nexabuild-${{ steps.cfg.outputs.appName }}-$V.apk"; done
          for f in *.aab; do [ -f "$f" ] && mv "$f" "nexabuild-${{ steps.cfg.outputs.appName }}-$V.aab"; done
          ls -la

      - name: Upload ke GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.cfg.outputs.versionName }}-${{ steps.cfg.outputs.versionCode }}
          name: "NexaBuild ${{ steps.cfg.outputs.appName }} v${{ steps.cfg.outputs.versionName }}"
          files: out/*
          fail_on_unmatched_files: false

      - name: Update builds.json status final
        if: always()
        run: |
          python3 - <<'PY'
          import json,base64,os,urllib.request
          cfg=json.load(open("nexabuild.config.json"))
          tok=os.environ["GITHUB_TOKEN"]; repo=os.environ["REPO"]
          api=f"https://api.github.com/repos/{repo}/contents/builds.json"
          req=urllib.request.Request(api,headers={"Authorization":f"Bearer {tok}","Accept":"application/vnd.github+json"})
          sha=None; builds=[]
          try:
              d=json.load(urllib.request.urlopen(req))
              sha=d["sha"]; builds=json.loads(base64.b64decode(d["content"]).replace(b"\n",b""))["builds"]
          except Exception: pass
          for b in builds:
              if b.get("packageId")==cfg["packageId"] and b.get("versionCode")==cfg["versionCode"]:
                  b["status"]="success" if os.environ["CONCLUSION"]=="success" else "failed"
          body=json.dumps({"builds":builds}).encode()
          data=json.dumps({"message":"NexaBuild: final status","content":base64.b64encode(body).decode(),"sha":sha,"branch":"main"}).encode()
          r=urllib.request.Request(api,data=data,method="PUT",headers={"Authorization":f"Bearer {tok}","Accept":"application/vnd.github+json"})
          urllib.request.urlopen(r)
          PY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CONCLUSION: ${{ job.status }}
